name: Build Madi Music APK

on:
  push:
    branches: [madi-ui-upgrade]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            '504667f4c0de7af1a06de9f4b1727b84351b0e' \
            > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name 'MadiMusic-Android-Source*.zip' | head -n 1)
          test -n "$ZIP" || { echo 'Project ZIP not found'; exit 1; }
          mkdir -p project
          unzip -q "$ZIP" -d project
          PROJECT=$(find project -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT" || { echo 'Project not found'; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Configure Firebase Android SDK
        shell: bash
        run: |
          set -euo pipefail
          APP="$PROJECT_DIR/app"
          ROOT_BUILD="$PROJECT_DIR/build.gradle.kts"
          APP_BUILD="$APP/build.gradle.kts"
          test -f google-services.json || { echo 'google-services.json missing from repository root'; exit 1; }
          test -f "$ROOT_BUILD" || { echo 'Root build.gradle.kts not found'; exit 1; }
          test -f "$APP_BUILD" || { echo 'App build.gradle.kts not found'; exit 1; }
          mkdir -p "$APP"
          cp google-services.json "$APP/google-services.json"
          python3 - "$ROOT_BUILD" "$APP_BUILD" <<'PY'
          import pathlib, re, sys
          root_path, app_path = map(pathlib.Path, sys.argv[1:])
          root = root_path.read_text()
          app = app_path.read_text()

          if 'com.google.gms.google-services' not in root:
              match = re.search(r'plugins\s*\{', root)
              if not match:
                  raise SystemExit('Root Gradle plugins block not found; refusing unsafe patch')
              end = root.find('}', match.end())
              if end < 0:
                  raise SystemExit('Root Gradle plugins block is incomplete')
              root = root[:end] + '\n    id("com.google.gms.google-services") version "4.4.2" apply false\n' + root[end:]

          if 'com.google.gms.google-services' not in app:
              match = re.search(r'plugins\s*\{', app)
              if not match:
                  raise SystemExit('App Gradle plugins block not found; refusing unsafe patch')
              end = app.find('}', match.end())
              if end < 0:
                  raise SystemExit('App Gradle plugins block is incomplete')
              app = app[:end] + '\n    id("com.google.gms.google-services")\n' + app[end:]

          if 'com.google.firebase:firebase-auth' not in app:
              match = re.search(r'dependencies\s*\{', app)
              if not match:
                  raise SystemExit('App Gradle dependencies block not found; refusing unsafe patch')
              end = app.find('}', match.end())
              if end < 0:
                  raise SystemExit('App Gradle dependencies block is incomplete')
              firebase = ('\n    implementation(platform("com.google.firebase:firebase-bom:33.7.0"))'
                          '\n    implementation("com.google.firebase:firebase-auth")\n')
              app = app[:end] + firebase + app[end:]

          if 'com.google.android.gms:play-services-auth' not in app:
              match = re.search(r'dependencies\s*\{', app)
              if not match: raise SystemExit('App Gradle dependencies block not found')
              end = app.find('}', match.end())
              if end < 0: raise SystemExit('App Gradle dependencies block is incomplete')
              app = app[:end] + '\n    implementation("com.google.android.gms:play-services-auth:21.3.0")\n' + app[end:]

          root_path.write_text(root)
          app_path.write_text(app)
          print('Firebase configuration and Authentication SDK added')
          PY

      - name: Download audio packs from release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p audio-packs
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(gh release view --repo "$GH_REPO" --json tagName --jq .tagName)"
          fi
          gh release download "$TAG" --repo "$GH_REPO" --dir audio-packs
          ls -lah audio-packs

      - name: Extract and number all 16 songs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          # Keep artist archives separate so duplicate basenames cannot overwrite tracks.
          for f in audio-packs/*; do
            pack="$(basename "$f")"
            pack="${pack%.*}"
            dest="extracted/$pack"
            mkdir -p "$dest"
            case "$f" in
              *.zip) unzip -oq "$f" -d "$dest" ;;
              *.7z) 7z x -y "-o$PWD/$dest" "$f" >/dev/null ;;
              *) echo "Unsupported audio asset: $f"; exit 1 ;;
            esac
          done

          mapfile -d '' -t TRACKS < <(
            find extracted -type f -iname '*.mp3' -print0 | sort -zV
          )

          echo "Found ${#TRACKS[@]} MP3 files"
          if [ "${#TRACKS[@]}" -ne 16 ]; then
            echo "Expected 16 MP3 files but found ${#TRACKS[@]}"
            printf '%s\n' "${TRACKS[@]}"
            exit 1
          fi

          MUSIC="$PROJECT_DIR/app/src/main/assets/music"
          mkdir -p "$MUSIC"

          for i in "${!TRACKS[@]}"; do
            number=$(printf "%03d" "$((i + 1))")
            test -s "${TRACKS[$i]}" || { echo "Empty audio file: ${TRACKS[$i]}"; exit 1; }
            echo "Audio mapping: $number.mp3 <- ${TRACKS[$i]}"
            cp -f "${TRACKS[$i]}" "$MUSIC/$number.mp3"
          done
          test "$(find "$MUSIC" -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 16

      - name: Install redesigned Madi Music interface
        shell: bash
        run: |
          set -euo pipefail
          DEST="$PROJECT_DIR/app/src/main/java/com/madi/music"
          mkdir -p "$DEST"
          cp overrides/MainActivity.kt "$DEST/MainActivity.kt"
          cp overrides/MusicCatalog.kt "$DEST/MusicCatalog.kt"
          cp overrides/MusicPlaybackService.kt "$DEST/MusicPlaybackService.kt"
          cp overrides/MadiAudioEffects.kt "$DEST/MadiAudioEffects.kt"
          echo "Redesigned UI, catalog, playback service and audio effects installed"

      - name: Create premium launcher icon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          PROJECT="$PROJECT_DIR"
          RES="$PROJECT/app/src/main/res"
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26"
          convert -background none assets/madi-launcher.svg -resize 512x512 "$RES/drawable/madi_launcher.png"
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            pixels="${spec##*:}"
            mkdir -p "$RES/mipmap-$density"
            convert "$RES/drawable/madi_launcher.png" -resize "${pixels}x${pixels}" "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable/madi_launcher" />
          </adaptive-icon>
          XML
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          MANIFEST="$PROJECT/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          import sys, xml.etree.ElementTree as ET
          p=sys.argv[1]
          tree=ET.parse(p); root=tree.getroot()
          ns='{http://schemas.android.com/apk/res/android}'
          app=root.find('application')
          if app is None: raise SystemExit('AndroidManifest.xml has no application element')
          app.set(ns+'icon','@mipmap/ic_launcher')
          app.set(ns+'roundIcon','@mipmap/ic_launcher_round')
          tree.write(p, encoding='utf-8', xml_declaration=True)
          print('Manifest launcher icon attributes verified')
          PY
          echo "Adaptive Madi Music launcher icons installed"

      - name: Restore stable Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: madi-music-debug-keystore-v1

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Print Android debug signing fingerprints
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          test -f "$KEYSTORE" || { echo 'Debug keystore not found'; exit 1; }
          keytool -list -v -keystore "$KEYSTORE" -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madi-Music-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
