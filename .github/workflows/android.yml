
name: Build Madi Music APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip p7zip-full
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -iname 'MadiMusic-Android-Source*.zip' | head -1)
          test -n "$ZIP"
          mkdir project
          unzip -q "$ZIP" -d project
          PROJECT=$(find project -name settings.gradle.kts -printf '%h\n' | head -1)
          test -n "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madi-Music-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
