
name: Build Madi Music APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name 'MadiMusic-Android-Source*.zip' | head -n 1)
          test -n "$ZIP" || { echo 'Project ZIP not found in repository root'; exit 1; }
          mkdir -p project
          unzip -q "$ZIP" -d project
          PROJECT=$(find project -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT" || { echo 'settings.gradle.kts not found'; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Download audio packs from this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
              run: |
          set -euo pipefail
          mkdir -p audio-packs
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(gh release view --repo "$GH_REPO" --json tagName --jq .tagName)"
          fi
          gh release download "$TAG" --repo "$GH_REPO" --dir audio-packs
          ls -lah audio-packs

      - name: Put all 16 MP3 files into app assets
        run: |
          set -euo pipefail
          MUSIC="$PROJECT_DIR/app/src/main/assets/music"
          mkdir -p "$MUSIC" extracted
          for f in audio-packs/*; do
            case "$f" in
              *.zip) unzip -oq "$f" -d extracted ;;
              *.7z) 7z x -y "-o$PWD/extracted" "$f" >/dev/null ;;
              *) echo "Unsupported audio asset: $f"; exit 1 ;;
            esac
          done
          find extracted -type f -iname '*.mp3' -exec cp -f {} "$MUSIC/" \;
          for n in $(seq 1 16); do
            name=$(printf "%03d" "$n")
            test -s "$MUSIC/$name.mp3" || { echo "Missing music/$name.mp3"; exit 1; }
          done
          echo "Verified 16 MP3 files"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madi-Music-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
