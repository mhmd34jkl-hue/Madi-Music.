name: Build Madi Music APK

on:
  push:
    branches: [madi-ui-upgrade, feature/firebase-auth]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: madi-music-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            '504667f4c0de7af1a06de9f4b1727b84351b0e' \
            > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name 'MadiMusic-Android-Source*.zip' | head -n 1)
          test -n "$ZIP" || { echo 'Project ZIP not found'; exit 1; }
          mkdir -p project
          unzip -q "$ZIP" -d project
          PROJECT=$(find project -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT" || { echo 'Project not found'; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Configure Firebase Android SDK
        shell: bash
        run: |
          set -euo pipefail
          APP="$PROJECT_DIR/app"
          ROOT_BUILD="$PROJECT_DIR/build.gradle.kts"
          APP_BUILD="$APP/build.gradle.kts"
          test -f google-services.json || { echo 'google-services.json missing from repository root'; exit 1; }
          test -f "$ROOT_BUILD" || { echo 'Root build.gradle.kts not found'; exit 1; }
          test -f "$APP_BUILD" || { echo 'App build.gradle.kts not found'; exit 1; }
          mkdir -p "$APP"
          cp google-services.json "$APP/google-services.json"
          python3 - "$ROOT_BUILD" "$APP_BUILD" <<'PY'
          import pathlib, re, sys
          root_path, app_path = map(pathlib.Path, sys.argv[1:])
          root = root_path.read_text()
          app = app_path.read_text()

          if 'com.google.gms.google-services' not in root:
              match = re.search(r'plugins\s*\{', root)
              if not match:
                  raise SystemExit('Root Gradle plugins block not found; refusing unsafe patch')
              end = root.find('}', match.end())
              if end < 0:
                  raise SystemExit('Root Gradle plugins block is incomplete')
              root = root[:end] + '\n    id("com.google.gms.google-services") version "4.4.2" apply false\n' + root[end:]

          if 'com.google.gms.google-services' not in app:
              match = re.search(r'plugins\s*\{', app)
              if not match:
                  raise SystemExit('App Gradle plugins block not found; refusing unsafe patch')
              end = app.find('}', match.end())
              if end < 0:
                  raise SystemExit('App Gradle plugins block is incomplete')
              app = app[:end] + '\n    id("com.google.gms.google-services")\n' + app[end:]

          if 'com.google.firebase:firebase-auth' not in app:
              match = re.search(r'dependencies\s*\{', app)
              if not match:
                  raise SystemExit('App Gradle dependencies block not found; refusing unsafe patch')
              end = app.find('}', match.end())
              if end < 0:
                  raise SystemExit('App Gradle dependencies block is incomplete')
              firebase = ('\n    implementation(platform("com.google.firebase:firebase-bom:33.7.0"))'
                          '\n    implementation("com.google.firebase:firebase-auth")\n')
              app = app[:end] + firebase + app[end:]

          if 'com.google.android.gms:play-services-auth' not in app:
              match = re.search(r'dependencies\s*\{', app)
              if not match: raise SystemExit('App Gradle dependencies block not found')
              end = app.find('}', match.end())
              if end < 0: raise SystemExit('App Gradle dependencies block is incomplete')
              app = app[:end] + '\n    implementation("com.google.android.gms:play-services-auth:21.3.0")\n' + app[end:]

          root_path.write_text(root)
          app_path.write_text(app)
          print('Firebase configuration and Authentication SDK added')
          PY

      - name: Download audio packs from release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p audio-packs
          # Audio packs live in the dedicated v1.0 release.
          # Never download the separate emoji/font release (emoji-v1) as audio input.
          TAG="v1.0"
          gh release download "$TAG" --repo "$GH_REPO" --dir audio-packs --pattern '*.zip' --pattern '*.7z'
          # Enforce a strict archive-only boundary before extraction.
          if find audio-packs -maxdepth 1 -type f ! -iname '*.zip' ! -iname '*.7z' | grep -q .; then
            echo "Non-audio asset found in audio-packs; refusing to continue" >&2
            exit 1
          fi
          test "$(find audio-packs -maxdepth 1 -type f | wc -l)" -eq 6
          ls -lah audio-packs

      - name: Extract and number all 16 songs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          # Keep artist archives separate so duplicate basenames cannot overwrite tracks.
          for f in audio-packs/*; do
            pack="$(basename "$f")"
            pack="${pack%.*}"
            dest="extracted/$pack"
            mkdir -p "$dest"
            case "$f" in
              *.zip) unzip -oq "$f" -d "$dest" ;;
              *.7z) 7z x -y "-o$PWD/$dest" "$f" >/dev/null ;;
              *) echo "Unsupported audio asset: $f"; exit 1 ;;
            esac
          done

          pick_track() {
            local pattern="$1"
            local folder="$2"
            local result
            result="$(find "$folder" -type f -iname "$pattern" -print -quit)"
            if [ -z "$result" ]; then
              echo "Missing audio match: $pattern in $folder" >&2
              exit 1
            fi
            printf '%s' "$result"
          }

          # Explicit title-to-file mapping. Never sort unrelated song names alphabetically.
          TRACKS=(
            "$(pick_track '001.mp3' 'extracted/01-Cheb-Akil')"
            "$(pick_track '002.mp3' 'extracted/01-Cheb-Akil')"
            "$(pick_track '003.mp3' 'extracted/01-Cheb-Akil')"
            "$(pick_track '004.mp3' 'extracted/02-Cheb-MoMo-A')"
            "$(pick_track '005.mp3' 'extracted/02-Cheb-MoMo-A')"
            "$(pick_track '006.mp3' 'extracted/03-Cheb-MoMo-B')"
            "$(pick_track '007.mp3' 'extracted/03-Cheb-MoMo-B')"
            "$(pick_track '*كوالالمبور*.mp3' 'extracted/04-Aljundi')"
            "$(pick_track '*لاريا*.mp3' 'extracted/04-Aljundi')"
            "$(pick_track '*دمعة*.mp3' 'extracted/04-Aljundi')"
            "$(pick_track '*يدوم عليهم*.mp3' 'extracted/05-Rafea-Alakoky')"
            "$(pick_track '*مش اثنين ونحنا واحد*.mp3' 'extracted/05-Rafea-Alakoky')"
            "$(pick_track '*مانواطي شاني*.mp3' 'extracted/05-Rafea-Alakoky')"
            "$(pick_track '*بابا نويل*.mp3' 'extracted/06-Colomby')"
            "$(pick_track '*عيوني*.mp3' 'extracted/06-Colomby')"
            "$(pick_track '*نظره*.mp3' 'extracted/06-Colomby')"
          )

          echo "Verified explicit mapping for ${#TRACKS[@]} tracks"
          if [ "${#TRACKS[@]}" -ne 16 ]; then
            echo "Expected 16 MP3 files but mapped ${#TRACKS[@]}"
            exit 1
          fi

          MUSIC="$PROJECT_DIR/app/src/main/assets/music"
          mkdir -p "$MUSIC"
          declare -A USED_SOURCES=()
          for i in "${!TRACKS[@]}"; do
            number=$(printf "%03d" "$((i + 1))")
            source="${TRACKS[$i]}"
            test -s "$source" || { echo "Missing or empty audio: $source"; exit 1; }
            if [[ -n "${USED_SOURCES[$source]:-}" ]]; then
              echo "Audio source assigned twice: $source"
              exit 1
            fi
            USED_SOURCES["$source"]=1
            echo "Verified audio mapping: $number.mp3 <- $source"
            cp -f "$source" "$MUSIC/$number.mp3"
          done
          test "$(find "$MUSIC" -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 16

      - name: Install redesigned Madi Music interface
        shell: bash
        run: |
          set -euo pipefail
          DEST="$PROJECT_DIR/app/src/main/java/com/madi/music"
          mkdir -p "$DEST"
          cp overrides/MainActivity.kt "$DEST/MainActivity.kt"
          cp overrides/MusicCatalog.kt "$DEST/MusicCatalog.kt"
          cp overrides/MusicPlaybackService.kt "$DEST/MusicPlaybackService.kt"
          cp overrides/MadiAudioEffects.kt "$DEST/MadiAudioEffects.kt"
          echo "Redesigned UI, catalog, playback service and audio effects installed"

      - name: Create premium launcher icon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          PROJECT="$PROJECT_DIR"
          RES="$PROJECT/app/src/main/res"
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26"
          convert -background none assets/madi-launcher.svg -resize 512x512 "$RES/drawable/madi_launcher.png"
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            pixels="${spec##*:}"
            mkdir -p "$RES/mipmap-$density"
            convert "$RES/drawable/madi_launcher.png" -resize "${pixels}x${pixels}" "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable/madi_launcher" />
          </adaptive-icon>
          XML
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          MANIFEST="$PROJECT/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          import pathlib, re, sys
          p=pathlib.Path(sys.argv[1])
          s=p.read_text()
          app_match=re.search(r'<application\b[^>]*>', s)
          if not app_match:
              raise SystemExit('AndroidManifest.xml has no application element')
          tag=app_match.group(0)
          tag=re.sub(r'\s+android:(?:icon|roundIcon)="[^"]*"', '', tag)
          tag=tag[:-1] + ' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">'
          s=s[:app_match.start()]+tag+s[app_match.end():]
          permissions=[
              'android.permission.INTERNET',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
              'android.permission.POST_NOTIFICATIONS'
          ]
          for permission in permissions:
              if permission not in s:
                  s=s.replace('<application', f'<uses-permission android:name="{permission}" />\n    <application', 1)
          service_match=re.search(r'<service\b[^>]*android:name="[^"]*MusicPlaybackService"[^>]*>', s)
          if service_match:
              st=service_match.group(0)
              if 'android:exported=' not in st:
                  st=st[:-1]+' android:exported="true">'
              if 'android:foregroundServiceType=' not in st:
                  st=st[:-1]+' android:foregroundServiceType="mediaPlayback">'
              s=s[:service_match.start()]+st+s[service_match.end():]
          elif 'androidx.media3.session.MediaSessionService' not in s:
              service='<service android:name=".MusicPlaybackService" android:exported="true" android:foregroundServiceType="mediaPlayback"><intent-filter><action android:name="androidx.media3.session.MediaSessionService" /></intent-filter></service>'
              s=s.replace('</application>', service+'\n</application>', 1)
          if 'androidx.media3.session.MediaSessionService' not in s:
              s=s.replace('</application>', '<service android:name=".MusicPlaybackService" android:exported="true" android:foregroundServiceType="mediaPlayback"><intent-filter><action android:name="androidx.media3.session.MediaSessionService" /></intent-filter></service>\n</application>', 1)
          p.write_text(s)
          print('Manifest permissions, MediaSessionService and adaptive icon verified')
          PY
          echo "Adaptive Madi Music launcher icons installed"

      - name: Restore stable Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: madi-music-debug-keystore-v1

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install uploaded iPhone font
        shell: bash
        run: |
          set -euo pipefail
          FONT_DIR="$PROJECT_DIR/app/src/main/res/font"
          mkdir -p "$FONT_DIR"
          test -s "iPhone.ttf" || { echo 'Uploaded iPhone.ttf is missing from repository root'; exit 1; }
          cp "iPhone.ttf" "$FONT_DIR/iphone.ttf"
          test -s "$FONT_DIR/iphone.ttf"
          grep -q "R.font.iphone" overrides/MainActivity.kt
          echo "Installed user-uploaded iPhone.ttf and verified the fixed Compose font reference"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Print Android debug signing fingerprints
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          test -f "$KEYSTORE" || { echo 'Debug keystore not found'; exit 1; }
          keytool -list -v -keystore "$KEYSTORE" -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madi-Music-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
