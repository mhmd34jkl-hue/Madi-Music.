name: Inspect Madi user assets (no APK build)

on:
  push:
    branches: [feature/madi-ui-polish-no-build]

permissions:
  contents: write

jobs:
  inspect-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory ZIP images, fetch artist portraits and subset iPhone emoji font
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "New Folder.zip"
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 -m pip install --user fonttools
          mkdir -p inspected-assets artist-downloads
          gh release download emoji-v1 --repo "$GH_REPO" --dir artist-downloads --pattern '*.ttf'
          test -s artist-downloads/iOS17.4.ANSHULDIXIT.ttf
          curl -fL --retry 3 "https://is1-ssl.mzstatic.com/image/thumb/AMCArtistImages126/v4/cb/b3/39/cbb339f7-ed32-cfc5-20c6-610dcf4d3ccb/499f803a-e680-436b-b6b4-c97726363f6f_ami-identity-4dbac9010ef18890bafd2dc7e2f8ca8e-2023-03-20T09-39-14.518Z_cropped.png/400x400bb.jpg" -o artist-downloads/cheb-akil.jpg
          curl -fL --retry 3 "https://i.iheart.com/v3/catalog/artist/37222363?ops=fit%28480%2C480%29%2Crun%28%22circle%22%29" -o artist-downloads/cheb-momo.jpg
          curl -fL --retry 3 "https://24hip-hop.com/wp-content/uploads/2022/09/WhatsApp-Image-2022-09-29-at-9.46.17-AM-e1664543537463.jpeg" -o artist-downloads/aljundi.jpg
          curl -fL --retry 3 "https://i.scdn.co/image/ab6761610000e5eb05f5e7a2f8bfc757be0eeb74" -o artist-downloads/rafea.jpg
          curl -fL --retry 3 "https://i.ytimg.com/vi/v8TBDTnMsjY/maxresdefault.jpg" -o artist-downloads/colomby.jpg
          python3 - <<'PY'
          import zipfile, pathlib, io, unicodedata, subprocess
          from PIL import Image, ImageOps, ImageDraw
          from fontTools.ttLib import TTFont
          out=pathlib.Path("inspected-assets")
          z=zipfile.ZipFile("New Folder.zip")
          rows=[]
          for info in z.infolist():
              if info.is_dir(): continue
              p=pathlib.PurePosixPath(info.filename)
              if p.suffix.lower() not in (".png",".jpg",".jpeg",".webp"): continue
              try:
                  raw=z.read(info); im=Image.open(io.BytesIO(raw)).convert("RGB")
                  thumb=im.copy(); thumb.thumbnail((220,170))
                  rows.append((info.filename,thumb,info.file_size))
                  (out/(f"{len(rows):02d}_"+p.name.replace("/","_"))).write_bytes(raw)
                  if p.name.casefold()=="login screen.png":
                      im.save(out/"login-screen-reference.png",quality=95)
              except Exception: pass
          if not rows: raise SystemExit("No readable images found in New Folder.zip")
          w,h,cols=260,220,3
          sheet=Image.new("RGB",(cols*w,((len(rows)+cols-1)//cols)*h),(20,16,28))
          draw=ImageDraw.Draw(sheet)
          for i,(name,im,size) in enumerate(rows):
              x=(i%cols)*w; y=(i//cols)*h
              sheet.paste(im,(x+(w-im.width)//2,y+4))
              label=name if len(name)<36 else name[:33]+"..."
              draw.text((x+8,y+180),label,fill=(245,235,255))
              draw.text((x+8,y+198),f"{im.width}x{im.height} | {size} bytes",fill=(180,165,195))
          sheet.save(out/"contact-sheet.jpg",quality=90)
          with open(out/"inventory.txt","w") as f:
              for name,im,size in rows: f.write(f"{name}\t{im.width}x{im.height}\t{size}\n")
          print("READABLE_ZIP_IMAGES",len(rows))
          # Artist portrait sources, separately named and cropped to square.
          specs={
            "artist_cheb_akil.png":("artist-downloads/cheb-akil.jpg",None),
            "artist_cheb_momo.png":("artist-downloads/cheb-momo.jpg","circle"),
            "artist_aljundi.png":("artist-downloads/aljundi.jpg",(120,0,644,524)),
            "artist_rafea_alakoky.png":("artist-downloads/rafea.jpg",None),
            "artist_colomby.png":("artist-downloads/colomby.jpg",(0,0,720,720)),
          }
          for name,(src,crop) in specs.items():
              im=Image.open(src).convert("RGBA")
              if crop=="circle":
                  im=ImageOps.fit(im,(512,512),centering=(0.5,0.5))
                  mask=Image.new("L",(512,512),0); ImageDraw.Draw(mask).ellipse((0,0,511,511),fill=255); im.putalpha(mask)
              elif isinstance(crop,tuple):
                  im=im.crop(crop)
                  im=ImageOps.fit(im,(512,512),centering=(0.5,0.5))
              else:
                  im=ImageOps.fit(im,(512,512),centering=(0.5,0.5))
              im.save(out/name,optimize=True)
              print("ARTIST_PORTRAIT",name,im.size)
          font_path=pathlib.Path("artist-downloads/iOS17.4.ANSHULDIXIT.ttf")
          font=TTFont(str(font_path))
          cmap=set()
          for table in font['cmap'].tables: cmap.update(table.cmap.keys())
          wanted={
            0x1F50D,0x1F50E,0x1F3A7,0x1F3B5,0x1F3B6,0x1F451,0x2764,0x2728,
            0x1F1F1,0x1F1FE,0x1F512,0x1F50A,0x1F3A4,0x1F389,0x1F44D,0x1F60D,
            0x1F525,0x1F680,0x1F4F1,0x1F3BC,0x1F3A9,0x1F4BF,0x1F4F7,0x1F4AC,
            0x1F4A1,0x1F4A5,0x1F48B,0x1F49C,0x1F3C6,0x1F3B9,0x1F3B8,0x1F3B7,
            0x1F4F9,0x1F4FA,0x1F3AE,0x1F3AF,0x1F4E2,0x1F4E3,0x1F4E4,0x1F4E5,
            0x1F4F2,0x1F4F3,0x1F4F4,0x1F4F5,0x1F4F6,0x1F4F8,0x1F4FB,0x1F4FC,
            0x1F3B2,0x1F3B0,0x1F3B1,0x1F3B3,0x1F3B4,0x1F3BA,0x1F3BB,0x1F3BD,
            0x1F3BE,0x1F3BF,0x1F44F,0x1F44E,0x1F64F,0x1F64C,0x1F4A9,0x1F62D,
            0x1F61C,0x1F914,0x1F973,0x1F970,0x1F97A,0x1F92D,0x1F621,0x1F60A,
            0x1F60E,0x1F923,0x1F62E,0x1F910,0x1F4A8,0x1F4A7,0x1F31F,0x1F3FB,
            0x1F3FC,0x1F3FD,0x1F3FE,0x1F3FF,0x200D,0xFE0E,0xFE0F,0x20E3
          }
          selected=wanted & cmap
          if not selected: raise SystemExit("Emoji font had no expected emoji Unicode coverage")
          unicode_arg=",".join(f"U+{cp:04X}" for cp in sorted(selected))
          subprocess.run(["/home/runner/.local/bin/pyftsubset",str(font_path),"--output-file="+str(out/"ios_emoji_subset.ttf"),"--unicodes="+unicode_arg,"--layout-features=*","--glyph-names","--symbol-cmap","--legacy-cmap","--notdef-glyph","--notdef-outline","--recommended-glyphs","--name-IDs=*","--name-languages=*"],check=True)
          subset=out/"ios_emoji_subset.ttf"
          subfont=TTFont(str(subset))
          with open(out/"emoji-font-report.txt","w") as f:
              f.write(f"Original bytes: {font_path.stat().st_size}\nSubset bytes: {subset.stat().st_size}\nUnicode codepoints retained: {len(selected)}\nOriginal tables: {sorted(font.keys())}\nSubset tables: {sorted(subfont.keys())}\n")
          print("EMOJI_FONT_ORIGINAL_BYTES",font_path.stat().st_size)
          print("EMOJI_FONT_SUBSET_BYTES",subset.stat().st_size)
          print("EMOJI_CODEPOINTS",len(selected))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: madi-user-assets-inspection
          path: inspected-assets/
          if-no-files-found: error
      - name: Commit optimized font and artist portraits to the no-build branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artist-assets
          cp inspected-assets/artist_*.png artist-assets/
          cp inspected-assets/ios_emoji_subset.ttf artist-assets/
          cp inspected-assets/emoji-font-report.txt artist-assets/
          cat > artist-assets/SOURCES.md <<'EOF'
          Artist portrait source notes:
          - Cheb Akil: Shazam artist profile portrait.
          - Cheb Momo: iHeart artist portrait.
          - Aljundi: 24Hip-Hop artist feature portrait.
          - Rafea Alakoky: Spotify artist profile portrait.
          - Colomby: official Colomby YouTube video thumbnail, cropped to the artist.
          Emoji font: user's iOS17.4.ANSHULDIXIT.ttf from the emoji-v1 release; subsetted to the common emoji glyphs used by the app to avoid adding the full 47 MB font.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artist-assets/
          if ! git diff --cached --quiet; then
            git commit -m "Add artist portraits and compact iPhone emoji font [asset-bot]"
            git push origin HEAD:feature/madi-ui-polish-no-build
          fi
